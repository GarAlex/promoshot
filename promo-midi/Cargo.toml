[package]
name = "promo-midi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MIDI-sequenced sound for PromoShot: the midi block expanded to events, rendered with a SoundFont to 48 kHz WAV, the receipt and the settle"

[lints]
workspace = true

[dependencies]
# The typed `midi` block and its receipt.
promo-model = { path = "../promo-model" }
# One loudness for every host: the BS.1770 meter the normalize stage uses.
promo-media = { path = "../promo-media" }
serde_json.workspace = true
sha2 = "0.10"
# The layer gate and high-pass: libm transcendentals, the same bits everywhere.
libm = "0.2"
# The synth: a pure-Rust SoundFont renderer (MIT).
rustysynth = "1.3.8"
# Reading an imported .mid (Unlicense); no rayon.
midly = { version = "0.5", default-features = false, features = ["std"] }
ureq = { version = "2", optional = true }

[features]
# Installing the bank from its pinned URL. The apps bundle their copy and
# leave it out.
default = ["download", "generate"]
download = ["dep:ureq"]
# Generated layers: the ACE-Step REST client (MIDI.md §7). The apps keep it
# (the Mac generates; every host mixes the stored file either way).
generate = ["dep:ureq"]

[dev-dependencies]
midly = { version = "0.5", default-features = false, features = ["std"] }
