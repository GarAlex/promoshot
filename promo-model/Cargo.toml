[package]
name = "promo-model"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The machine half of the format: a JSON Schema GENERATED from these same
# structs, so it cannot drift from what the parser accepts.
schemars = "1"

[dev-dependencies]
# Holds the generated schema to the recipes and the full fixture.
jsonschema = { version = "0.28", default-features = false }
