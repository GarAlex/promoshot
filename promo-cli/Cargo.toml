[package]
name = "promo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "promo"
path = "src/main.rs"

[dependencies]
promo-model = { path = "../promo-model" }
promo-timeline = { path = "../promo-timeline" }
promo-editor = { path = "../promo-editor" }
promo-gpu = { path = "../promo-gpu" }
promo-engine = { path = "../promo-engine" }
serde_json.workspace = true
# PNG/JPEG only: this decodes project images and writes frames, it is not an
# image-processing tool.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
