[package]
name = "promo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# A lib as well as a bin: promo-ffi re-exposes render::Renderer over the C
# ABI, so front ends that are not Rust drive the same host the CLI is.
[lib]
name = "promo_cli"
path = "src/lib.rs"

[[bin]]
name = "promo"
path = "src/main.rs"

[dependencies]
promo-model = { path = "../promo-model" }
promo-timeline = { path = "../promo-timeline" }
promo-gpu = { path = "../promo-gpu" }
promo-engine = { path = "../promo-engine" }
promo-media = { path = "../promo-media" }
serde_json.workspace = true
# PNG/JPEG only: this decodes project images and writes frames, it is not an
# image-processing tool.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
