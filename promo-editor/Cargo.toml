[package]
name = "promo-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

# Deliberately model + timeline only: no GPU, no I/O, no platform crates. This
# crate has to build wherever a front end does — macOS through the FFI, Linux
# and Windows by direct dependency — so anything that would pin it to one of
# them belongs somewhere else.

[lints]
workspace = true

[dependencies]
promo-model = { path = "../promo-model" }
promo-timeline = { path = "../promo-timeline" }
# The author module's spec crosses as JSON; serde is no more platform-bound
# than the model that already depends on it.
serde.workspace = true
serde_json.workspace = true
# The Command enum is served to agents as a generated JSON Schema.
schemars = "1"
