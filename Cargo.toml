[workspace]
resolver = "2"
members = [
    "promo-model",
    "promo-timeline",
    "promo-gpu",
    "promo-media",
    "promo-engine",
    "promo-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["Alex"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wgpu = "23"
criterion = "0.5"

[profile.release]
lto = "thin"
debug = 1
