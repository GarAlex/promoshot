[workspace]
resolver = "2"
members = [
    "promo-model",
    "promo-timeline",
    "promo-editor",
    "promo-text",
    "promo-cli",
    "promo-gpu",
    "promo-media",
    "promo-engine",
    "promo-ffi",
    "promo-author",
    "promoshot-mcp",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "Apache-2.0"
authors = ["Alex"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wgpu = "23"
criterion = "0.5"

[profile.release]
lto = "thin"
debug = 1
