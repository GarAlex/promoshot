[workspace]
resolver = "2"
members = [
    "promo-model",
    "promo-timeline",
    "promo-editor",
    "promo-text",
    "promo-cli",
    "promo-gpu",
    "promo-media",
    "promo-engine",
    "promo-author",
    "promo-speech",
    "promo-midi",
    "promo-music",
    "promo-svg",
    "promoshot-mcp",
]

# One disagreement with clippy, stated once for every crate.
#
# `chunks_exact(4)` over an RGBA buffer is this codebase's pixel idiom —
# it appears 43 times — and 1.98 wants `as_chunks::<4>().0`. That returns
# a tuple and changes the shape of every call site, in the code where a
# slip is a rendering bug, for no gain at runtime. The lint is right in
# general and wrong here.
[workspace.lints.clippy]
chunks_exact_to_as_chunks = "allow"

[workspace.package]
version = "0.4.7"
edition = "2021"
license = "Apache-2.0"
authors = ["Alex"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: the default parser can land a number one ulp off, so a
# value written and read back (the apps' whole-document replace) was not the
# value the core computed — a generated beat-flash key at 2 - 1/30 came back
# as 1.9666666666666663.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_ignored = "0.1"
serde_path_to_error = "0.1"
thiserror = "2"
wgpu = "23"
criterion = "0.5"

[profile.release]
lto = "thin"
debug = 1
