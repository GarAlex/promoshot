[package]
name = "promo-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
promo-model = { path = "../promo-model" }
# The CLI's host (render::Renderer), re-exposed over the C ABI so non-Rust
# front ends drive the same implementation the render oracle runs.
promo-cli = { path = "../promo-cli" }
promo-timeline = { path = "../promo-timeline" }
promo-editor = { path = "../promo-editor" }
promo-engine = { path = "../promo-engine" }
promo-gpu = { path = "../promo-gpu" }
promo-text = { path = "../promo-text" }
serde_json.workspace = true
serde.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "ffi_bench"
harness = false
