[package]
name = "promo-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true


[dependencies]
wgpu.workspace = true
thiserror.workspace = true
lyon_tessellation = "1.0.20"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# Must match the versions wgpu-hal's Metal backend uses, so raw-texture
# interop hands over the same types.
wgpu-hal = { version = "23", features = ["metal"] }
metal = "0.29"
objc = "0.2"
core-foundation = "0.10"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "spike_bench"
harness = false

# This crate cannot inherit `workspace.lints` — Cargo refuses a crate that
# both inherits and declares — so the workspace's one clippy allow is
# repeated here beside the rust lint that keeps it from inheriting. Keep
# the two in step; the reason is in the root Cargo.toml.
[lints.clippy]
chunks_exact_to_as_chunks = "allow"

# objc 0.2's msg_send! expands cfg(feature = "cargo-clippy") checks; declare
# the value expected so -D warnings doesn't trip on third-party macro output.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("cargo-clippy"))']

[[bench]]
name = "compositor_bench"
harness = false
