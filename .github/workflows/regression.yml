# The regression round: the whole truth on Linux, in the environment the
# Docker image renders in — lavapipe for a GPU, Liberation and DejaVu for
# fonts, ffmpeg for video.
#
# Runs on every push to main (so a failure is seen the day it lands, not at
# the next tag), on demand, and as a reusable workflow — release.yml calls
# it on every tag and publishes nothing unless it passes. It failed
# 19 times out of 19 while nothing read it; two things make it readable now:
# `--no-fail-fast`, so one failing crate no longer hides the rest, and one
# annotation per failed test, which the check-runs API serves without a
# token. The toolchain is pinned so a new stable's lints cannot turn it red
# overnight (4 Sep: 47 new lints, no code change); `latest-stable` watches
# the next compiler without blocking anything.
name: regression

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The Dockerfile's own list: whatever the renderer needs to be real
      # on a machine with no screen and no GPU.
      - name: The render environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg mesa-vulkan-drivers libvulkan1 fontconfig \
            fonts-liberation fonts-dejavu-core
          fc-list | wc -l

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee /tmp/test.log
      - name: Name every failed test
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path("/tmp/test.log").read_text(errors="replace") if pathlib.Path("/tmp/test.log").exists() else ""
          def esc(s): return s.replace("%", "%25").replace("\r", "").replace("\n", " / ")
          failed = re.findall(r"^test (\S+) \.\.\. FAILED$", log, re.M)
          for name in failed:
              m = re.search(r"---- " + re.escape(name) + r" stdout ----\n(.*?)(?:\n\n|\n---- |\Z)", log, re.S)
              lines = [l.strip() for l in (m.group(1) if m else "").splitlines()]
              keep = [l for l in lines if l and not l.startswith("note:")][:6]
              print(f"::error title={esc(name)}::{esc(' | '.join(keep))[:1500] or 'failed'}")
          for crate in re.findall(r"^error: could not compile `([^`]+)`", log, re.M):
              print(f"::error title=compile {esc(crate)}::could not compile")
          print(f"::notice title=cargo test::{len(failed)} failed test(s)")
          PY

      # A render, not just a compile: the suite can be green while nothing
      # reaches a frame. LinuxSmoke.promo exists for this.
      - name: render
        run: |
          cargo build --release -p promo-cli
          ./target/release/promo validate examples/LinuxSmoke.promo
          ./target/release/promo frames examples/LinuxSmoke.promo \
            --out /tmp/frames --sample 6 --sheet /tmp/sheet.png --json
          python3 - <<'PY'
          import pathlib, sys
          sheet = pathlib.Path("/tmp/sheet.png")
          size = sheet.stat().st_size if sheet.exists() else 0
          print(f"contact sheet: {size} bytes")
          # A blank sheet compresses to almost nothing; a real one does not.
          sys.exit(0 if size > 20_000 else "the sheet is empty — the renderer drew nothing")
          PY

      - name: keep the sheet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-contact-sheet
          path: /tmp/sheet.png
          if-no-files-found: warn

  latest-stable:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: stable
          components: clippy
      - name: clippy on the next compiler (informational)
        run: cargo clippy --workspace --all-targets -- -D warnings
