# Prebuilt binaries and a pullable image, on every version tag (issue #2):
# using the MCP server should be a connect, not a compile. Push a tag like
# v0.2.0 and this publishes:
#   - promoshot-<tag>-linux-x64.tar.gz  (promo + promoshot-mcp)
#   - promoshot-<tag>-macos-arm64.tar.gz
#   - ghcr.io/garalex/promoshot-mcp:<tag> and :latest
#
# Nothing publishes until the regression round passes on the tagged commit:
# both publishing jobs need it. (Until 2026-09-27 a tag published whatever
# it pointed at while regression was red — 19 runs out of 19.)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  regression:
    uses: ./.github/workflows/regression.yml
    permissions:
      contents: read

  binaries:
    needs: regression
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: 1.96.0
      - name: Build the pair
        run: cargo build --release -p promo-cli -p promoshot-mcp
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/promoshot-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            -C target/release promo promoshot-mcp
      # Provenance a downloader can verify (`gh attestation verify`), instead
      # of a checksum published on the same page as the file it vouches for.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.tar.gz
      - name: Attach to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true

  docker:
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (from the tag, loaded locally, not yet pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: promoshot-mcp:smoke
      # The image the MCP registry runs must render before anyone pulls it:
      # a real frame from the example it ships, as the image's own user.
      - name: Smoke render inside the image
        run: |
          docker run --rm --entrypoint promo promoshot-mcp:smoke \
            validate /usr/local/share/promoshot/examples/ProductCard.promo
          docker run --rm --entrypoint sh promoshot-mcp:smoke -c \
            'promo still /usr/local/share/promoshot/examples/ProductCard.promo --out /tmp/smoke.png --time 1 --size 480x300 && test $(wc -c < /tmp/smoke.png) -gt 20000'
      - name: Push
        run: |
          for tag in "${GITHUB_REF_NAME}" latest; do
            docker tag promoshot-mcp:smoke "ghcr.io/garalex/promoshot-mcp:${tag}"
            docker push "ghcr.io/garalex/promoshot-mcp:${tag}"
          done
