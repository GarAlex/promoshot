# Publish to the official MCP Registry (GitHub's MCP Registry consumes this).
name: publish-mcp

# The release workflow creates the GitHub Release with GITHUB_TOKEN, and
# events raised by that token never start other workflows — so `release:
# published` alone would sleep through every real release (it did, for
# v0.2.3). workflow_run on the release workflow is exempt from that rule.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  docker:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag (from server.json — the manifest names the image it publishes)
        id: tag
        run: |
          tag=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['identifier'].split(':')[-1])")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/garalex/promoshot-mcp:${{ steps.tag.outputs.tag }}
            ghcr.io/garalex/promoshot-mcp:latest

  publish:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o /tmp/mcp-publisher.tgz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          tar -xzf /tmp/mcp-publisher.tgz -C /tmp mcp-publisher
          sudo mv /tmp/mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version || true
      - name: Authenticate to MCP Registry
        run: mcp-publisher login github-oidc
      - name: Publish server.json
        run: mcp-publisher publish
