# Publish to the official MCP Registry (GitHub's MCP Registry consumes this).
name: publish-mcp

# The release workflow creates the GitHub Release with GITHUB_TOKEN, and
# events raised by that token never start other workflows — so `release:
# published` alone would sleep through every real release (it did, for
# v0.2.3). workflow_run on the release workflow is exempt from that rule.
#
# The image is built ONCE, by release.yml, from the tag. This workflow used
# to build it again from main's HEAD (a workflow_run checkout with no ref)
# and push it over the tag's image: v0.2.74 shipped a later demo commit.
# Now it only publishes server.json, read from the released commit.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o /tmp/mcp-publisher.tgz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tgz" | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tgz -C /tmp mcp-publisher
          sudo mv /tmp/mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version || true
      - name: Authenticate to MCP Registry
        run: mcp-publisher login github-oidc
      - name: Publish server.json
        run: mcp-publisher publish
