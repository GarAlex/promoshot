<?xml version="1.0" encoding="UTF-8"?>
<!-- One element per reason a drawing refuses. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="g"><stop offset="0" stop-color="#f00"/><stop offset="1" stop-color="#00f"/></linearGradient>
    <clipPath id="c"><rect width="200" height="200"/></clipPath>
  </defs>
  <polygon id="mitered" points="20,80 50,20 80,80" fill="none" stroke="#000" stroke-width="6"/>
  <line id="butt" x1="100" y1="20" x2="160" y2="20" stroke="#000" stroke-width="6"/>
  <path id="dashed" d="M100 50 h60" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-dasharray="6 4"/>
  <rect id="graded" x="180" y="20" width="40" height="40" fill="url(#g)"/>
  <g id="faded" opacity="0.5"><rect x="240" y="20" width="30" height="30" fill="#0a0"/><rect x="255" y="35" width="30" height="30" fill="#a00"/></g>
  <rect id="both" x="300" y="20" width="40" height="40" fill="#0a0" stroke="#000" stroke-width="4" stroke-linejoin="round" opacity="0.5"/>
  <g transform="skewX(30)"><circle id="skewed" cx="20" cy="140" r="20" fill="none" stroke="#000" stroke-width="4"/></g>
  <rect id="clipped" x="100" y="120" width="40" height="40" fill="#00a" clip-path="url(#c)"/>
  <text id="words" x="180" y="150" font-size="20">Hi</text>
  <path id="crossing" d="M220 110 L300 190 M300 110 L220 190" stroke="#000" stroke-opacity="0.5" stroke-width="16" stroke-linecap="round"/>
</svg>
