<?xml version="1.0" encoding="UTF-8"?>
<!-- Linear and radial gradients: userSpaceOnUse and bounding-box units,
     gradientTransform, a focal point, spread methods, stop opacity. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3c72"/>
      <stop offset="1" stop-color="#2a5298"/>
    </linearGradient>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="60" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ff9a9e"/>
      <stop offset="1" stop-color="#fad0c4"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.35">
      <stop offset="0" stop-color="#fff8e1"/>
      <stop offset="0.6" stop-color="#ffca28"/>
      <stop offset="1" stop-color="#ff6f00" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="tilt" href="#sky" gradientTransform="rotate(45 0.5 0.5)"/>
  </defs>
  <rect width="400" height="200" fill="url(#sky)"/>
  <rect x="20" y="20" width="160" height="40" fill="url(#band)"/>
  <circle cx="290" cy="90" r="70" fill="url(#sun)"/>
  <rect x="30" y="90" width="120" height="90" rx="14" fill="url(#tilt)" stroke="#fff" stroke-width="3"/>
</svg>
