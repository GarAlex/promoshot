<?xml version="1.0" encoding="UTF-8"?>
<!-- clipPath in both units, a clipped group, clip-rule. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <clipPath id="round">
      <circle cx="90" cy="100" r="70"/>
    </clipPath>
    <clipPath id="box" clipPathUnits="objectBoundingBox">
      <polygon points="0.5,0 1,0.5 0.5,1 0,0.5" clip-rule="evenodd"/>
    </clipPath>
  </defs>
  <rect width="300" height="200" fill="#eae2b7"/>
  <g clip-path="url(#round)">
    <rect x="0" y="0" width="300" height="100" fill="#d62828"/>
    <rect x="0" y="100" width="300" height="100" fill="#003049"/>
    <path d="M0 0 L300 200" stroke="#fcbf49" stroke-width="20"/>
  </g>
  <rect x="180" y="40" width="100" height="120" fill="#f77f00" clip-path="url(#box)"/>
</svg>
