<?xml version="1.0" encoding="UTF-8"?>
<!-- A luminance mask with a gradient, and an alpha mask. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160">
  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="lum" maskUnits="userSpaceOnUse" x="0" y="0" width="150" height="160">
      <rect width="150" height="160" fill="url(#fade)"/>
      <circle cx="75" cy="80" r="20" fill="#000"/>
    </mask>
    <mask id="alpha" mask-type="alpha">
      <path d="M160 20 h120 v120 z" fill="#000" fill-opacity="0.7"/>
    </mask>
  </defs>
  <rect width="300" height="160" fill="#222"/>
  <rect x="10" y="10" width="130" height="140" fill="#06d6a0" mask="url(#lum)"/>
  <rect x="160" y="20" width="120" height="120" fill="#ef476f" mask="url(#alpha)"/>
</svg>
