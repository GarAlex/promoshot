<?xml version="1.0" encoding="UTF-8"?>
<!-- The GPU's shapes and resvg's pieces in one paint order: a blur between
     two shapes that overlap it, a pattern fill, crisp edges, a focus on its
     circle's edge, a mask, a hairline — each left to resvg, composited
     where it falls. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3" fill="#ef233c"/></pattern>
    <radialGradient id="edge" cx="0.5" cy="0.5" r="0.5" fx="1" fy="0.5"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#2b2d42"/></radialGradient>
    <mask id="half"><rect x="200" y="100" width="40" height="70" fill="#fff"/></mask>
  </defs>
  <rect width="300" height="180" fill="#edf2f4"/>
  <rect x="20" y="20" width="80" height="60" fill="#8d99ae"/>
  <circle cx="90" cy="60" r="35" fill="#2b2d42" filter="url(#soft)"/>
  <rect x="70" y="50" width="60" height="40" fill="#ef233c" fill-opacity="0.7"/>
  <rect x="150" y="15" width="130" height="70" fill="url(#dots)" stroke="#2b2d42" stroke-width="3"/>
  <rect x="20" y="100" width="60" height="60" fill="#d90429" shape-rendering="crispEdges" transform="rotate(10 50 130)"/>
  <circle cx="140" cy="130" r="35" fill="url(#edge)"/>
  <rect x="190" y="100" width="90" height="70" fill="#2b2d42" mask="url(#half)"/>
  <path d="M190 95 L290 175" stroke="#000" stroke-width="0.6"/>
</svg>
