[package]
name = "promo-media"
version.workspace = true
edition.workspace = true
license.workspace = true


[lints]
workspace = true

[dependencies]
promo-model = { path = "../promo-model" }
promo-gpu = { path = "../promo-gpu" }
thiserror.workspace = true
# Stills as every renderer should see them (still.rs): EXIF orientation
# and ICC profiles are read here, and moxcms (already image's own colour
# engine) converts a P3 screenshot to sRGB the way ImageIO does in the apps.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
moxcms = "0.8"
# The beat tracker (beats.rs): every transcendental from libm, so a beat
# lands on the same bit on every machine; the cache keyed by SHA-256.
libm = "0.2"
sha2 = "0.10"
serde_json.workspace = true
