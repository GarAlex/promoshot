[package]
name = "promoshot-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server for rendering PromoShot projects headless, over the promo CLI"

[[bin]]
name = "promoshot-mcp"
path = "src/main.rs"

[dependencies]
promo-model = { path = "../promo-model" }
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
promo-timeline = { path = "../promo-timeline" }
