[package]
name = "promo-text"
version.workspace = true
edition.workspace = true
license.workspace = true


[lints]
workspace = true

[dependencies]
promo-model = { path = "../promo-model" }
# Shaping + layout + system font discovery. The one honest way to put text on
# a frame without a platform text stack.
cosmic-text = "0.12"
# Glyph outlines for text as a 3D body — the same version cosmic-text's
# shaper derefs to, so a face is one type.
ttf-parser = "0.21"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
