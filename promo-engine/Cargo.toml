[package]
name = "promo-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
promo-model = { path = "../promo-model" }
promo-timeline = { path = "../promo-timeline" }
promo-media = { path = "../promo-media" }
promo-gpu = { path = "../promo-gpu" }
promo-text = { path = "../promo-text" }
# glTF 2.0 binaries for model layers (3D plan P0). `import` decodes the
# buffers and embedded images; nothing here touches the GPU.
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names", "KHR_materials_unlit"] }

[dev-dependencies]
serde_json = "1"
criterion.workspace = true

[[bench]]
name = "preview_bench"
harness = false

[[bench]]
name = "mixer_bench"
harness = false
